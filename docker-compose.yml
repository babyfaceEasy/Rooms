services:
  mongodb:
    image: mongo:7
    container_name: temp_backend_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  rustfs:
    image: rustfs/rustfs:latest
    container_name: temp_backend_rustfs
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  createbuckets:
    image: amazon/aws-cli:latest
    container_name: temp_backend_createbuckets
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://rustfs:9000 s3 mb s3://temp-bucket || true;
      aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy --bucket temp-bucket --policy '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::temp-bucket/*\"]}]}';
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: temp_backend_api
    restart: unless-stopped
    environment:
      APP_NAME: temp_backend
      APP_ENV: development
      PORT: "8080"
      LOG_LEVEL: debug
      MONGO_URI: mongodb://admin:secret@mongodb:27017/temp_backend?authSource=admin
      MONGO_DATABASE: temp_backend
      MONGO_CONNECT_TIMEOUT: 10s
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_REGION: us-east-1
      S3_BUCKET: temp-bucket
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_SSL: "false"
      S3_PRESIGNED_EXPIRY: 15m
      S3_PUBLIC_URL: http://localhost:9000
      JWT_SECRET: LKBSSPsjj3jZSQ3TuYuGVVAmiyu1CAB4OxouAW2fZRU
      ACCESS_TOKEN_TTL: 1h
      REFRESH_TOKEN_TTL: 168h
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

volumes:
  mongo_data:
  rustfs_data:

upstream room_prod_server{
    server   prod.boukroom.com:8000;
}

server {

    listen 80;
    server_name prod.boukroom.com;
    return 301 https://prod.boukroom.com$request_uri;

}

server {

    listen 443 ssl;
    server_name prod.boukroom.com;

    ssl_certificate /etc/letsencrypt/live/prod.boukroom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prod.boukroom.com/privkey.pem;

    # Allow file uploads up to 110MB (set globally for this server block)
    client_max_body_size 10M;

    location / {
        proxy_pass http://room_prod_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;

        # Increase timeouts to prevent dropping large uploads on slower connections
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 75s;
    }


}
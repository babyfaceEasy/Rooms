version: "3.8"

services:
  room:
    image: 068709857936.dkr.ecr.us-east-1.amazonaws.com/bouk-room-dev:latest
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "us-east-1"
        awslogs-group: "/aws/docker/bouk-room-dev"
        awslogs-create-group: "true"
        tag: "room/{{.Name}}/{{.ID}}"   # stream name, similar to ECS's prefix/container/id